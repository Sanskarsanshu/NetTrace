name: NetTrace Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    name: Ubuntu (Standard & ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libasan8 libubsan1

      - name: Build (Release)
        run: |
          cmake -S engine -B engine/build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build-release --parallel

      - name: Run CTest (Release)
        run: |
          ctest --test-dir engine/build-release --output-on-failure

      - name: Build (ASan / UBSan)
        run: |
          cmake -S engine -B engine/build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
          cmake --build engine/build-asan --parallel

      - name: Verify Traceability
        run: python3 scripts/check_traceability.py

      - name: Run CTest under ASan & UBSan
        run: |
          ctest --test-dir engine/build-asan --output-on-failure

  test-windows:
    name: Windows (MSVC & CTest)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Traceability
        run: python scripts/check_traceability.py

      - name: Configure CMake
        run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build engine/build --config Release --parallel

      - name: Run CTest
        run: ctest --test-dir engine/build -C Release --output-on-failure
